<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AKS GitOps Platform</title>
  <desc id="desc">A cluster reconciled from Git in four layers, with policy-guarded tenant namespaces</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hex" width="42" height="72.75" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <path d="M21 0 42 12.1V36.4L21 48.5 0 36.4V12.1z M21 48.5V72.75" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#hex)"/>

  <g transform="translate(900 150)">
    <circle r="140" fill="url(#glow)"/>
    <!-- reconcile loop -->
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <path d="M-118 -30 A122 122 0 0 1 96 -76" stroke-opacity="0.65"/>
      <path d="M118 30 A122 122 0 0 1 -96 76" stroke-opacity="0.65"/>
    </g>
    <polygon points="96,-76 84,-92 108,-90" fill="#ffffff" fill-opacity="0.85" transform="rotate(20 96 -76)"/>
    <polygon points="-96,76 -84,92 -108,90" fill="#ffffff" fill-opacity="0.85" transform="rotate(20 -96 76)"/>

    <!-- four layers -->
    <g stroke="#ffffff" stroke-width="2">
      <rect x="-80" y="-66" width="160" height="26" rx="8" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="-80" y="-30" width="160" height="26" rx="8" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="-80" y="6" width="160" height="26" rx="8" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="-80" y="42" width="160" height="26" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    </g>
    <g fill="#0b1f4d">
      <circle cx="-62" cy="-53" r="5" fill="#ffffff"/>
      <circle cx="-62" cy="-17" r="5" fill="#ffffff"/>
      <circle cx="-62" cy="19" r="5" fill="#ffffff"/>
      <circle cx="-62" cy="55" r="5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.55">
      <rect x="-46" y="-56" width="90" height="6" rx="3"/>
      <rect x="-46" y="-20" width="70" height="6" rx="3"/>
      <rect x="-46" y="16" width="100" height="6" rx="3"/>
    </g>
    <rect x="-46" y="52" width="80" height="6" rx="3" fill="#2456c8"/>

    <!-- tenant namespaces -->
    <g fill="#0b1f4d" fill-opacity="0.5" stroke="#9cc0ff" stroke-width="2">
      <polygon points="-180,-20 -162,-30 -144,-20 -144,0 -162,10 -180,0"/>
      <polygon points="-196,30 -178,20 -160,30 -160,50 -178,60 -196,50"/>
      <polygon points="144,-20 162,-30 180,-20 180,0 162,10 144,0"/>
      <polygon points="160,30 178,20 196,30 196,50 178,60 160,50"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="3" fill-opacity="0.7">AKS · FLUX · GATEKEEPER · TERRAFORM</text>
    <text x="64" y="158" font-size="48" font-weight="700">AKS GitOps Platform</text>
    <text x="64" y="202" font-size="22" fill-opacity="0.85">A hardened cluster that runs from Git, and a</text>
    <text x="64" y="232" font-size="22" fill-opacity="0.85">guarded namespace for every team in one pull request.</text>
  </g>
</svg>
