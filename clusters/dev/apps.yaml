---
# Layer 4: tenant applications, deployed into namespaces from layer 3.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-tenants
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: cluster-config
  path: ./apps/dev
  prune: true
  wait: true
