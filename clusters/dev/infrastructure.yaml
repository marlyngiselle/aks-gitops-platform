---
# Layer 1a: cluster add-ons installed from Helm charts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: cluster-config
  path: ./infrastructure/controllers/dev
  prune: true
  wait: true
---
# Layer 1b: cluster configuration that needs the CRDs from layer 1a.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: cluster-config
  path: ./infrastructure/configs
  prune: true
