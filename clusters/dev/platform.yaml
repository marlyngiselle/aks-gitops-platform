---
# Layer 3: tenant namespaces created from the namespace-as-a-service
# template. Pruning is off: removing a team folder must never delete a
# namespace and everything in it as a side effect.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
    - name: policy-constraints
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: cluster-config
  path: ./platform/teams
  prune: false
  wait: true
