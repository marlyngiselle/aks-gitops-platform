---
apiVersion: v1
kind: Namespace
metadata:
  name: gatekeeper-system
  labels:
    team: platform
    cost-center: platform-engineering
    platform.example.com/tier: platform
    # Gatekeeper must never block its own pods.
    admission.gatekeeper.sh/ignore: no-self-managing
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gatekeeper
  namespace: gatekeeper-system
spec:
  interval: 12h
  url: https://open-policy-agent.github.io/gatekeeper/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: gatekeeper-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gatekeeper
      version: "3.23.1"
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    replicas: 2
    auditInterval: 60
    constraintViolationsLimit: 50
    logDenies: true
    # Fail open in base so a Gatekeeper outage cannot block deployments in
    # dev; the prod overlay fails closed.
    validatingWebhookFailurePolicy: Ignore
    postInstall:
      labelNamespace:
        enabled: false
    controllerManager:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    audit:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
