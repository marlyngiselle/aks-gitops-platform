---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    team: platform
    cost-center: platform-engineering
    platform.example.com/tier: platform
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 12h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      interval: 12h
  # ServiceMonitor CRDs come from kube-prometheus-stack.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    controller:
      replicaCount: 2
      ingressClassResource:
        name: nginx
        default: true
      service:
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
      config:
        use-forwarded-headers: "true"
        enable-real-ip: "true"
      allowSnippetAnnotations: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
