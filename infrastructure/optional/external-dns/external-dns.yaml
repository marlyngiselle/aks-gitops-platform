---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    team: platform
    cost-center: platform-engineering
    platform.example.com/tier: platform
---
# Not a secret: identifiers only. Authentication uses workload identity
# (the `external-dns` entry in infra/terraform var.workload_identities).
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-azure
  namespace: external-dns
data:
  azure.json: |
    {
      "tenantId": "00000000-0000-0000-0000-000000000000",
      "subscriptionId": "00000000-0000-0000-0000-000000000000",
      "resourceGroup": "rg-dns-example",
      "useWorkloadIdentityExtension": true
    }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 12h
  url: https://kubernetes-sigs.github.io/external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    provider:
      name: azure
    sources:
      - ingress
      - service
    domainFilters:
      - example.com
    txtOwnerId: aks-idp-prod-weu
    # Never delete records this controller did not create.
    policy: upsert-only
    serviceAccount:
      labels:
        azure.workload.identity/use: "true"
      annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
