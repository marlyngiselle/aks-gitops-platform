---
apiVersion: v1
kind: Namespace
metadata:
  # Renamed by the overlay's `namespace:` field.
  name: team-namespace
  labels:
    team: TEAM
    cost-center: COST_CENTER
    # Tenant namespaces are the scope of the Gatekeeper constraints.
    platform.example.com/tier: tenant
    # Baseline Pod Security Standard enforced by the API server itself, as a
    # second layer under Gatekeeper.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
