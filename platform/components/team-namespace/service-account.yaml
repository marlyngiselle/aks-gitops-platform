---
# Workloads that call Azure APIs run as this service account. The client ID
# belongs to a user-assigned identity federated with
# system:serviceaccount:<namespace>:workload. Pods opt in with the label
# azure.workload.identity/use: "true".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  annotations:
    azure.workload.identity/client-id: WORKLOAD_IDENTITY_CLIENT_ID
